[global]
flavor = "gfm"
disable = ["MD013", "MD025", "MD033", "MD041"]
exclude = [
  "**/.git/",
  "**/.tmp/",
  "**/tmp/",
  "**/archive/",
  "**/*.tmp.md",

  # --- --- --- ---  --- --- --- ---  --- --- --- ---  --- --- --- ---
  ".github/",
  "node_modules/",
  "vendor/",
  "dist/",
  "build/",
]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD029]
style = "one"

[MD033]
disallowed-elements = ["gfm"]
fix = false

[MD048]
style = "backtick"

[MD057]
compact-paths = true

[MD060]
style = "compact"
loose-last-column = true
