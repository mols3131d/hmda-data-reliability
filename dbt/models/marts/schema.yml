version: 2

models:
  - name: mart_hmda_loan_outcomes
    description: "activity_year, state_code, loan_purpose grain의 HMDA 대출 결과 mart"
    columns:
      - name: mart_grain_key
        data_tests:
          - not_null
          - unique
      - name: activity_year
        data_tests:
          - not_null
      - name: state_code
        data_tests:
          - not_null
      - name: loan_purpose
        data_tests:
          - not_null
      - name: application_count
        data_tests:
          - not_null
      - name: approval_count
        data_tests:
          - not_null
      - name: denial_count
        data_tests:
          - not_null
      - name: approval_rate
      - name: average_loan_amount
      - name: average_income
