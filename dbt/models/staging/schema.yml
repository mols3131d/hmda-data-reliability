version: 2

models:
  - name: stg_hmda_loans
    description: "raw HMDA 대출 신청 데이터를 분석용 컬럼 계약으로 정리한 staging 모델"
    columns:
      - name: activity_year
        data_tests:
          - not_null
      - name: state_code
        data_tests:
          - not_null
      - name: county_code
      - name: loan_purpose
        data_tests:
          - not_null
      - name: action_taken
        data_tests:
          - not_null
      - name: loan_amount
      - name: income
      - name: source_file
        data_tests:
          - not_null
      - name: source_year
        data_tests:
          - not_null
