glob_matcher: doublestar

pre-commit:
  parallel: true

  commands:
    markdown-fix:
      glob: "**/*.md"
      run: uv run rumdl check --fix --deny-config-warnings {staged_files}
      stage_fixed: true
    python-fix:
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    markdown-check:
      glob: "**/*.md"
      run: uv run rumdl check --deny-config-warnings {push_files}
    python-check:
      glob: "**/*.py"
      run: uv run ruff check {push_files} && uv run ruff format --check {push_files}
    ty-check:
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: uv run ty check
    pytest-affected:
      glob: "**/*.py"
      run: uv run pytest --testmon --testmon-forceselect
    pytest-dbt:
      glob:
        - "dbt/**/*.sql"
        - "dbt/**/*.yml"
        - "dbt/**/*.yaml"
      run: uv run pytest tests/dbt
    pytest-global:
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      run: uv run pytest -n auto -m "unit and not memory and not stress"
