glob_matcher: doublestar

pre-commit:
  commands:
    markdown-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.md"
      run: uv run --no-sync rumdl fmt {files}
      stage_fixed: true
    python-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.py"
      run: uv run --no-sync ruff check --fix {files} && uv run --no-sync ruff format {files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    python-check:
      glob: "**/*.py"
      run: |
        set --
        for file in {push_files}; do
          [ -f "$file" ] && set -- "$@" "$file"
        done
        [ "$#" -eq 0 ] || {
          uv run --no-sync ruff check "$@" &&
          uv run --no-sync ruff format --check "$@"
        }
    ty-check:
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: |
        full=false
        set --
        for file in {push_files}; do
          case "$file" in
            pyproject.toml) full=true ;;
            *.py) [ -f "$file" ] && set -- "$@" "$file" ;;
          esac
        done
        if [ "$full" = true ]; then
          uv run --no-sync ty check
        elif [ "$#" -ne 0 ]; then
          uv run --no-sync ty check "$@"
        fi
    pytest-python:
      glob:
        - "**/*.py"
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      run: |
        full=false
        for file in {push_files}; do
          case "$file" in
            .python-version|pyproject.toml|uv.lock)
              full=true
              break
              ;;
          esac
        done
        if [ "$full" = true ]; then
          uv run --no-sync pytest -n auto -m "unit and not memory and not stress"
        else
          uv run --no-sync pytest --testmon --testmon-forceselect
        fi
    pytest-dbt:
      glob:
        - "dbt/**/*.sql"
        - "dbt/**/*.yml"
        - "dbt/**/*.yaml"
      run: uv run --no-sync pytest tests/dbt
