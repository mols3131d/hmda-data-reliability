glob_matcher: doublestar

pre-commit:
  commands:
    json-fix:
      glob:
        - "**/*.json"
        - "**/*.jsonc"
      run: uv run --no-sync python scripts/biome.py format --write {staged_files}
      stage_fixed: true
    markdown-fix:
      glob: "**/*.md"
      run: uv run --no-sync rumdl fmt {staged_files}
      stage_fixed: true
    python-fix:
      glob: "**/*.py"
      run: uv run --no-sync ruff check --fix {staged_files} && uv run --no-sync ruff format {staged_files}
      stage_fixed: true
    toml-fix:
      glob: "**/*.toml"
      run: uv run --no-sync python scripts/tombi.py format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    json-check:
      glob:
        - "**/*.json"
        - "**/*.jsonc"
      run: uv run --no-sync python scripts/biome.py check {push_files}
    openspec-check:
      glob: "openspec/**"
      run: npm exec --yes --package @fission-ai/openspec@1.12.0 -- openspec validate --all --strict
    python-check:
      glob: "**/*.py"
      run: uv run --no-sync ruff check {push_files} && uv run --no-sync ruff format --check {push_files}
    pytest-affected:
      glob: "**/*.py"
      run: uv run --no-sync pytest --testmon --testmon-forceselect
    pytest-dbt:
      glob:
        - "dbt/**/*.sql"
        - "dbt/**/*.yml"
        - "dbt/**/*.yaml"
      run: uv run --no-sync pytest tests/dbt
    toml-check:
      glob: "**/*.toml"
      run: uv run --no-sync python scripts/tombi.py format --check {push_files} && uv run --no-sync python scripts/tombi.py lint {push_files}
