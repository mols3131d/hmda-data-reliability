glob_matcher: doublestar

pre-commit:
  commands:
    markdown-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.md"
      run: uv run rumdl check --fix --deny-config-warnings {files}
      stage_fixed: true
    python-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.py"
      run: uv run ruff check --fix {files} && uv run ruff format {files}
      stage_fixed: true

pre-push:
  commands:
    markdown-check:
      glob: "**/*.md"
      run: |
        set --
        for file in {push_files}; do
          [ -f "$file" ] && set -- "$@" "$file"
        done
        [ "$#" -eq 0 ] || uv run rumdl check --deny-config-warnings "$@"
    python-check:
      glob: "**/*.py"
      run: |
        set --
        for file in {push_files}; do
          [ -f "$file" ] && set -- "$@" "$file"
        done
        [ "$#" -eq 0 ] || {
          uv run ruff check "$@" && uv run ruff format --check "$@"
        }
    ty-check:
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: uv run ty check
    pytest-affected:
      glob: "**/*.py"
      run: uv run pytest --testmon --testmon-forceselect
    pytest-dbt:
      glob:
        - "dbt/**/*.sql"
        - "dbt/**/*.yml"
        - "dbt/**/*.yaml"
      run: uv run pytest tests/dbt
    pytest-global:
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      run: uv run pytest -n auto -m "unit and not memory and not stress"
