glob_matcher: doublestar

pre-commit:
  commands:
    markdown-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.md"
      run: uv run --no-sync rumdl fmt {files}
      stage_fixed: true
    python-fix:
      files: git diff --cached --name-only --diff-filter=d
      glob: "**/*.py"
      run: uv run --no-sync ruff check --fix {files} && uv run --no-sync ruff format {files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    python-check:
      glob: "**/*.py"
      run: |
        set --
        for file in {push_files}; do
          [ -f "$file" ] && set -- "$@" "$file"
        done
        [ "$#" -eq 0 ] || {
          uv run --no-sync ruff check "$@" &&
          uv run --no-sync ruff format --check "$@"
        }
    pytest-affected:
      glob: "**/*.py"
      run: uv run --no-sync pytest --testmon --testmon-forceselect
    pytest-dbt:
      glob:
        - "dbt/**/*.sql"
        - "dbt/**/*.yml"
        - "dbt/**/*.yaml"
      run: uv run --no-sync pytest tests/dbt
