[project]
name = "project-pivot"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dbt-core>=1.10.0",
  "dbt-duckdb>=1.9.0",
  "duckdb>=1.3.0",
  "langgraph>=0.4.0",
  "pandas>=2.3.0",
  "pyarrow>=20.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "rumdl>=0.2.6",
  "ty>=0.0.42",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
