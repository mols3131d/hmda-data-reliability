[project]
name = "project-pivot"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "altair>=5.5.0",
  "dagster>=1.13.16",
  "dagster-dg-cli>=1.13.16",
  "dagster-webserver>=1.13.16",
  "dbt-core>=1.12.0",
  "dbt-duckdb>=1.10.1",
  "duckdb>=1.5.5",
  "langgraph>=1.2.10",
  "polars>=1.43.2",
  "pyarrow>=25.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pyiceberg>=0.11.1",
  "pyromark>=0.9.13",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.51",
  "sqlglot>=30.14.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.165.0",
  "lefthook>=2.1.10",
  "marimo>=0.23.16",
  "mypy>=2.3.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-html>=4.2.0",
  "pytest-opentelemetry>=1.1.0",
  "pytest-sugar>=1.1.1",
  "pytest-testmon>=2.2.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "python-dotenv>=1.2.2",
  "ruff>=0.16.1",
  "rumdl>=0.2.48",
  "ty>=0.0.65",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "project_pivot"
defs_module = "project_pivot.orchestration.defs"
code_location_target_module = "project_pivot.orchestration.definitions"

[tool.marimo.runtime]
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--timeout=60 --strict-markers -m 'not memory and not stress'"
markers = [
  "unit: pure function and isolated domain tests",
  "component: package-level tests using local files",
  "integration: cross-system workflow tests",
  "memory: representative process-level memory-budget test",
  "stress: worst-case resource stress test",
]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
