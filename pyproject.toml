[project]
name = "project-pivot"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dagster>=1.10.0",
  "dagster-dg-cli>=1.13.8",
  "dagster-webserver>=1.13.8",
  "dbt-core>=1.10.0",
  "dbt-duckdb>=1.9.0",
  "duckdb>=1.3.0",
  "langgraph>=0.4.0",
  "polars>=1.41.2",
  "pyarrow>=20.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "pyiceberg>=0.11.1",
  "pyromark>=0.9.13",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.50",
  "sqlglot>=30.9.0",
]

[dependency-groups]
dev = [
  "lefthook>=2.1.9",
  "marimo>=0.23.9",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-html>=4.2.0",
  "pytest-sugar>=1.1.1",
  "pytest-testmon>=2.2.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "python-dotenv>=1.2.2",
  "ruff>=0.11.0",
  "rumdl>=0.2.6",
  "ty>=0.0.42",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "project_pivot"
defs_module = "project_pivot.orchestration.defs"
code_location_target_module = "project_pivot.orchestration.definitions"

[tool.marimo.runtime]
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-n auto --timeout=60 --html=pytest_report.html --self-contained-html --strict-markers"
markers = [
  "unit: pure function and isolated domain tests",
  "component: package-level tests using local files",
  "integration: cross-system workflow tests",
]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
