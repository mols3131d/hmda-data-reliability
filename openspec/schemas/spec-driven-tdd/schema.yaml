name: spec-driven-tdd
version: 1
description: Spec-driven planning with TDD-compatible execution

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change intent, scope, and affected capabilities
    template: proposal.md
    instruction: |
      변경의 목적, 범위와 영향을 받는 capability를 합의한다.

      기존 capability로 설명할 수 있는 변경에는 새 capability를 만들지 않는다.
      독립적으로 구현하고 검증할 수 있는 변경은 별도 proposal로 분리한다.
      구현 접근과 작업 순서는 design과 tasks에 맡긴다.

      목적과 경계가 후속 behavior contract를 작성하기에 충분할 때 완료한다.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Verifiable behavior contracts for affected capabilities
    template: spec.md
    instruction: |
      proposal에 선언된 capability의 관찰 가능하고 검증 가능한 행동 계약을 정의한다.

      행동 계약은 구현 방법과 독립적이어야 하며 중요한 정상 동작, 실패 조건과 경계를 포함한다.

      proposal의 capability 범위가 검증 가능한 계약으로 표현되었을 때 완료한다.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical approach, boundaries, and verification strategy
    template: design.md
    instruction: |
      proposal과 specs를 충족하는 구현 접근과 책임 경계를 정의한다.

      specs를 반복하지 않고 구현에 필요한 중요한 판단만 기록한다.

      tasks를 안정적으로 도출할 수 있을 때 완료한다.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Ordered and verifiable TDD implementation checklist
    template: tasks.md
    instruction: |
      specs와 design을 순서가 있는 검증 가능한 구현 작업으로 분해한다.

      행동 변경은 가능한 범위에서 test-first feedback loop로 구성한다.
      각 작업은 하나의 명확한 결과와 객관적인 완료 조건을 가진다.
      계획 오류를 owning artifact로 되돌릴 수 있게 추적성을 유지한다.

      모든 계획 범위가 의존성 순서와 검증 근거를 가진 작업으로 연결되었을 때 완료한다.
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    미완료 tasks를 의존성 순서로 구현한다.

    구현은 프로젝트 지침에 맞는 test-first feedback loop를 사용한다.
    계획의 오류나 누락이 확인되면 owning planning artifact를 갱신하고
    영향받는 downstream planning artifact와 tasks를 다시 일치시킨다.
