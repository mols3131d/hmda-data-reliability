schema: spec-driven-tdd

context: |
  로컬 HMDA 데이터의 수집, 변환과 reliability lifecycle을 다루는 데이터 엔지니어링 프로젝트다.
  주요 기술은 Python, DuckDB, dbt, Apache Airflow, pytest, uv다.

  Domain ownership은 docs/domains/OVERVIEW.md를 따른다.

  Spec ID:
  <domain>[-<subdomain>]-<capability>[-<extensions>]

  Change ID:
  <domain>[-<subdomain>][-<capability>]-<short-title>[-<extensions>]

  모든 ID는 owning domain부터 시작하고 lowercase kebab-case를 사용한다.
  Spec의 capability와 Change의 short-title은 필수다.
  subdomain과 extensions는 필요한 경우에만 사용한다.
  Change의 capability는 분류에 도움이 될 때만 포함한다.
  Spec은 지속적인 capability를 나타내는 명사형으로 작성한다.
  Change의 short-title은 구체적인 의도나 결과를 짧게 표현한다.
  short-title에는 update, improvement, enhancement, extension 같은 모호한 표현을 피한다.
  동급인 여러 domain을 하나의 이름에 나열하지 않는다.

rules:
  proposal:
    - owning domain, 변경 결과와 영향받는 Spec을 명확히 하고 관련 capability가 있으면 함께 식별한다.

  design:
    - data grain, data schema, idempotency와 recovery를 검토하되 변경되는 technical delta가 있을 때만 Design에 기록한다.
