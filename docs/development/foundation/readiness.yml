risks:
  - area: HMDA EDA
    text: actual-source evidence가 dirty repository revision에서 생성되어 현재 provenance contract와 불일치함
    impact: Foundation EDA 완료 증거로 사용할 수 없어 clean HEAD controlled run이 필요함
  - area: Data Platform
    text: cleanup_on_close가 caller-owned DuckDB 파일도 소유권 구분 없이 삭제할 수 있음
    impact: public utility 오사용 시 기존 개발·검증 DB가 삭제될 수 있음
  - area: Data Platform / Data Operations
    text: 상대 DuckDB 기본 경로가 Python ingestion과 dbt 실행 context에서 같은 파일을 가리킨다는 end-to-end 보장이 없음
    impact: 기본 pipeline에서 Bronze와 dbt가 서로 다른 DuckDB 파일을 사용할 위험이 있음
  - area: Data Operations
    text: dbt build 시작 전에 last-known-good artifact를 삭제하고 configured artifact path가 실제 dbt output을 제어하지 않음
    impact: build 실패 시 lineage evidence를 잃거나 성공한 build의 artifact를 잘못된 경로에서 검사할 수 있음
  - area: Data Operations
    text: public stage가 일부 HMDA·Reliability·DuckDB 오류를 DataOperationError로 변환하지 않음
    impact: caller가 application boundary 아래의 오류 taxonomy에 결합됨
  - area: Reliability
    text: freshness 미측정을 observed_at으로 대체하는 canonical contract가 실제 freshness와 미측정을 구분하지 못함
    impact: freshness_delay 탐지에서 false negative를 만들 수 있어 reliability evidence 의미가 왜곡될 수 있음
  - area: Reliability Specs
    text: approval-backfill-validation과 evaluation-report canonical spec의 Purpose가 TBD 상태임
    impact: 구현과 test가 있어도 canonical capability 의도와 경계를 완전히 설명하지 못함
  - area: Orchestration
    text: standard pipeline과 raw-only 실행이 같은 dbt asset materialization semantics를 공유함
    impact: dbt를 실행하지 않았는데 Silver/Gold asset이 materialized된 것으로 기록되어 실행 상태를 오해할 수 있음
  - area: Gold Analysis Metrics
    text: action_taken code별 모집단과 approval_rate denominator가 canonical contract에 없음
    impact: mart 결과가 계산되더라도 비즈니스 의미의 correctness를 검증할 수 없음
  - area: Foundation Completion Decision
    text: 최소 ready 완료 기준이 명시적으로 확정되지 않음
    impact: 테스트 통과 여부와 상관없이 Foundation 종료 판정이 지연될 수 있음

