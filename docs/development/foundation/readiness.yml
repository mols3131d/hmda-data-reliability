non_gating:
  - name: Reliability Freshness Semantics
    status: risk
    finding: 'Foundation data contract는 `freshness_at` 존재만 요구하고 `reliability-profile-snapshots`는 freshness를 측정할 수 없을 때 `observed_at` fallback을 명시한다. 미측정 상태의 별도 표현은 후속 contract 개선 후보다.'
  - name: dbt Last-Known-Good Evidence Retention
    status: implemented-unverified
    finding: '`run_dbt_build`는 고유한 run-scoped target에서 candidate artifact를 생성하고 기존 current pair를 건드리지 않는다. Promotion은 pair 단위 rollback을 보장한다. 선택적 재검증의 구현 revision과 test target을 기록했지만 current Foundation 전체 validation은 재실행하지 않았다.'
  - name: Data Platform Cleanup Ownership
    status: risk
    finding: '`cleanup_on_close=True`가 caller-owned DuckDB 파일을 소유권 구분 없이 삭제할 수 있다.'
  - name: Default DuckDB Path Consistency
    status: risk
    finding: '상대 기본 경로가 Python ingestion과 dbt subprocess에서 동일 파일을 가리킨다는 end-to-end oracle이 없다.'
  - name: Data Operations Error Boundary
    status: risk
    finding: '일부 하위 HMDA, Reliability, DuckDB 오류가 `DataOperationError`로 정규화되지 않는다.'
  - name: data-operations-incident-lifecycle
    status: implemented-unverified
    finding: 'detection, impact, remediation와 read-only side-effect oracle은 존재하지만 current HEAD 실행 evidence가 없다.'
  - name: reliability-recovery-backfill
    status: implemented-unverified
    finding: 'partition content identity와 recovery 경로가 `source_file` scope를 포함하며 source-file filtering과 file-scoped recovery test가 존재한다. Content identity가 correctness oracle이며 row-count는 auxiliary evidence로만 사용한다. 선택적 재검증의 구현 revision과 test target을 기록했지만 current Foundation 전체 validation은 재실행하지 않았다.'
  - name: reliability-evaluation-report
    status: implemented-unverified
    finding: 'aggregation/report oracle은 존재하지만 current HEAD 실행 evidence가 없다.'
  - name: orchestration-pipeline
    status: blocked
    finding: '`pipeline_job`이 `run_dbt_build=false`에서도 Silver/Gold asset materialization을 남기며 실제 integration test는 dbt skip 경로만 검증한다.'
  - name: hmda-data-synthetic-defects
    status: implemented-unverified
    finding: 'row drop, null spike, schema drift, freshness delay component oracle은 존재하지만 current HEAD 실행 evidence가 없다.'
  - name: Test Quality Observability
    status: implemented-unverified
    finding: 'pytest telemetry dependency와 Hypothesis invariant tests는 존재하지만 development/test tooling concern이며 canonical runtime Spec은 아니다.'

