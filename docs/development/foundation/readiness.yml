non_gating:
  - name: Reliability Freshness Semantics
    status: risk
    finding: 'Foundation reliability contract는 `freshness_at` 존재만 요구하고 후속 `profile-snapshots` spec은 freshness를 측정할 수 없을 때 `observed_at` fallback을 명시한다. 미측정 상태의 별도 표현은 후속 contract 개선 후보다.'
  - name: dbt Last-Known-Good Evidence Retention
    status: blocked
    finding: '`run_dbt_build`가 새 build 전에 기존 manifest와 run_results를 삭제하며 test도 이를 기대 동작으로 고정한다.'
  - name: Data Platform Cleanup Ownership
    status: risk
    finding: '`cleanup_on_close=True`가 caller-owned DuckDB 파일을 소유권 구분 없이 삭제할 수 있다.'
  - name: Default DuckDB Path Consistency
    status: risk
    finding: '상대 기본 경로가 Python ingestion과 dbt subprocess에서 동일 파일을 가리킨다는 end-to-end oracle이 없다.'
  - name: Data Operations Error Boundary
    status: risk
    finding: '일부 하위 HMDA, Reliability, DuckDB 오류가 `DataOperationError`로 정규화되지 않는다.'
  - name: Read-Only Incident Lifecycle
    status: implemented-unverified
    finding: 'detection, impact, LangGraph remediation와 read-only side-effect oracle은 존재하지만 current HEAD 실행 evidence가 없다.'
  - name: Approval Backfill Validation
    status: implemented-unverified
    finding: 'integration oracle은 존재하지만 current HEAD 실행 evidence가 없고 canonical spec Purpose가 TBD다.'
  - name: Evaluation Report
    status: implemented-unverified
    finding: 'aggregation/report oracle은 존재하지만 current HEAD 실행 evidence가 없고 canonical spec Purpose가 TBD다.'
  - name: Dagster Orchestration
    status: blocked
    finding: '`pipeline_job`이 `run_dbt_build=false`에서도 Silver/Gold asset materialization을 남기며 실제 integration test는 dbt skip 경로만 검증한다.'
  - name: Synthetic Reliability Cases
    status: implemented-unverified
    finding: 'row drop, null spike, schema drift, freshness delay component oracle은 존재하지만 current HEAD 실행 evidence가 없다.'
  - name: Test Quality Observability
    status: implemented-unverified
    finding: 'pytest telemetry dependency와 Hypothesis invariant tests는 존재하지만 current HEAD 실행 evidence가 없다.'

risks:
  - area: OpenSpec Traceability
    text: '`dbt-analytics-foundation` spec은 Gold metric 이름만 정의하고 세부 모집단·분모는 canonical Data Platform domain 문서에만 정의한다.'
    impact: '현재 구현과 test는 domain contract와 일치하지만 OpenSpec만 읽으면 metric semantics를 완전히 복원할 수 없다.'
  - area: Documentation Drift
    text: '`DEVELOPMENT.md`와 `pyproject.toml`에 Marimo가 active tool/dev dependency로 남아 있지만 EDA runtime과 notebook은 제거됐다.'
    impact: '현재 EDA 실행 방식과 개발 환경 설명이 다르게 읽힌다.'
  - area: Foundation Draft Drift
    text: 'Foundation README의 미결정 목록에 Gold grain과 notebook smoke가 남아 있어 현재 canonical contract와 맞지 않는다.'
    impact: 'non-canonical 초안을 읽는 사람이 이미 결정·제거된 항목을 미해결로 오해할 수 있다.'

