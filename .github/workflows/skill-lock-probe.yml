name: Skill Lock Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Refresh project Skill lock
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.5.23 update -p -y
      - name: Show generated Skill lock
        run: |
          cat skills-lock.json
          git diff -- skills-lock.json
