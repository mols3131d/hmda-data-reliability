name: CI Lite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-lite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout prospective merge
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Classify changes
        id: scope
        run: python3 scripts/ci/classify_changes.py "$GITHUB_OUTPUT"

      - name: Set up rumdl
        if: steps.scope.outputs.markdown == 'true'
        uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f # v0
        with:
          install-only: true
          version: "0.2.48"

      - name: Format changed Markdown and validate docs
        if: steps.scope.outputs.markdown == 'true'
        run: python3 scripts/ci/run_checks.py markdown

      - name: Validate OpenSpec
        if: steps.scope.outputs.openspec == 'true'
        env:
          ARCHIVED: ${{ steps.scope.outputs.openspec_archived }}
          BULK: ${{ steps.scope.outputs.openspec_bulk }}
          CHANGE_TARGETS: ${{ steps.scope.outputs.openspec_change_targets }}
          SPEC_TARGETS: ${{ steps.scope.outputs.openspec_spec_targets }}
        run: python3 scripts/ci/run_checks.py openspec

      - name: Install structured-data tooling
        if: steps.scope.outputs.json == 'true' || steps.scope.outputs.toml == 'true'
        env:
          JSON: ${{ steps.scope.outputs.json }}
          TOML: ${{ steps.scope.outputs.toml }}
        run: python3 scripts/ci/run_checks.py tooling

      - name: Validate changed JSON
        if: steps.scope.outputs.json == 'true'
        run: python3 scripts/ci/run_checks.py json

      - name: Validate changed TOML
        if: steps.scope.outputs.toml == 'true'
        run: python3 scripts/ci/run_checks.py toml

      - name: Set up uv
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.build == 'true' || steps.scope.outputs.lefthook == 'true' || steps.scope.outputs.routes == 'true' || steps.scope.outputs.tach == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify dependency lock
        if: steps.scope.outputs.lock == 'true'
        run: uv lock --check

      - name: Sync dependencies
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.tach == 'true'
        run: uv sync --locked

      - name: Check Python dependency boundaries
        id: boundaries
        if: steps.scope.outputs.tach == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync tach check
          uv run --no-sync pytest -q -p no:sugar --tb=short tests/scripts/test_tach.py tests/scripts/test_tach_config.py tests/review_ai/test_dependency_boundaries.py

      - name: Verify package build
        if: steps.scope.outputs.build == 'true'
        run: uv build --wheel --out-dir /tmp/dist

      - name: Validate Python
        if: steps.scope.outputs.python == 'true'
        env:
          FULL_TYPE: ${{ steps.scope.outputs.full_type }}
          TYPE_TARGETS: ${{ steps.scope.outputs.type_targets }}
        run: python3 scripts/ci/run_checks.py python

      - name: Validate chatbot routes
        if: steps.scope.outputs.routes == 'true'
        run: uv run --no-project --with "PyYAML==6.0.3" python -m scripts.agent_routes --check

      - name: Validate Lefthook config
        if: steps.scope.outputs.lefthook == 'true'
        run: uvx lefthook@2.1.10 validate

      - name: Run selected tests
        id: selected_tests
        if: steps.scope.outputs.tests == 'true'
        env:
          FULL_TESTS: ${{ steps.scope.outputs.full_tests }}
          TARGETS: ${{ steps.scope.outputs.targets }}
          BOUNDARIES_CHECKED: ${{ steps.boundaries.outcome == 'success' }}
        run: python3 scripts/ci/run_checks.py pytest
