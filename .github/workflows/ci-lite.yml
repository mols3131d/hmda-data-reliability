name: CI Lite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-lite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Classify changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          markdown=false
          tests=false
          lefthook=false
          full=false
          targets=()

          add_target() {
            local target="$1"
            local existing
            for existing in "${targets[@]}"; do
              [[ "$existing" == "$target" ]] && return
            done
            targets+=("$target")
          }

          while IFS= read -r path; do
            if [[ "$path" == *.md ]]; then
              [[ -f "$path" ]] && markdown=true
              continue
            fi

            case "$path" in
              lefthook.yml)
                lefthook=true
                ;;
              .python-version|pyproject.toml|uv.lock|.github/workflows/ci-lite.yml)
                tests=true
                full=true
                ;;
              dbt/*.sql|dbt/*.yml|dbt/*.yaml)
                tests=true
                add_target tests/dbt
                ;;
              src/project_pivot/logger.py)
                tests=true
                add_target tests/test_log_agent_event.py
                ;;
              src/project_pivot/*/*)
                domain="${path#src/project_pivot/}"
                domain="${domain%%/*}"
                case "$domain" in
                  shared|configs|utils)
                    tests=true
                    full=true
                    ;;
                  data_operations|data_platform|hmda_data|orchestration|reliability)
                    tests=true
                    add_target "tests/$domain"
                    case "$domain" in
                      data_operations)
                        add_target tests/orchestration
                        ;;
                      data_platform|hmda_data)
                        add_target tests/data_operations
                        add_target tests/dbt
                        ;;
                      reliability)
                        add_target tests/data_operations
                        ;;
                    esac
                    ;;
                  *)
                    tests=true
                    full=true
                    ;;
                esac
                ;;
              tests/test_log_agent_event.py)
                tests=true
                add_target tests/test_log_agent_event.py
                ;;
              tests/test_pytest_opentelemetry.py)
                tests=true
                add_target tests/test_pytest_opentelemetry.py
                ;;
              tests/*/*)
                domain="${path#tests/}"
                domain="${domain%%/*}"
                case "$domain" in
                  data_operations|data_platform|dbt|hmda_data|orchestration|reliability)
                    tests=true
                    add_target "tests/$domain"
                    ;;
                  *)
                    tests=true
                    full=true
                    ;;
                esac
                ;;
              src/project_pivot/*|tests/*|*.py)
                tests=true
                full=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [[ "$full" == true ]]; then
            targets=()
          fi

          {
            echo "markdown=$markdown"
            echo "tests=$tests"
            echo "lefthook=$lefthook"
            echo "full=$full"
            printf 'targets='
            printf '%s ' "${targets[@]}"
            echo
          } >> "$GITHUB_OUTPUT"

      - name: Set up rumdl
        if: steps.scope.outputs.markdown == 'true'
        uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f # v0
        with:
          install-only: true
          version: "0.2.48"

      - name: Check changed Markdown
        if: steps.scope.outputs.markdown == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.md' \
              | while IFS= read -r path; do
                  [[ ! -f "$path" ]] && continue
                  printf '%s\n' "$path"
                done
          )
          ((${#files[@]} == 0)) || rumdl check --deny-config-warnings "${files[@]}"

      - name: Set up Python
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.lefthook == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.lefthook == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.lefthook == 'true'
        run: uv sync --locked

      - name: Validate Lefthook config
        if: steps.scope.outputs.lefthook == 'true'
        run: uv run --no-sync lefthook validate

      - name: Run scoped unit tests
        if: steps.scope.outputs.tests == 'true'
        env:
          FULL: ${{ steps.scope.outputs.full }}
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          set -euo pipefail
          common=(
            uv run --no-sync pytest
            -q
            -p no:sugar
            --color=no
            --tb=short
            -ra
            -m "unit and not memory and not stress"
          )

          if [[ "$FULL" == true ]]; then
            "${common[@]}" -n auto
          else
            read -r -a targets <<< "$TARGETS"
            "${common[@]}" "${targets[@]}"
          fi
