name: CI Lite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-lite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout prospective merge
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changes
        id: scope
        run: bash scripts/ci/classify_changes.sh "$GITHUB_OUTPUT"

      - name: Set up rumdl
        if: steps.scope.outputs.markdown == 'true'
        uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f # v0
        with:
          install-only: true
          version: "0.2.48"

      - name: Format changed Markdown and validate docs
        if: steps.scope.outputs.markdown == 'true'
        run: bash scripts/ci/markdown.sh

      - name: Validate changed Inbox artifacts
        if: steps.scope.outputs.inbox == 'true'
        run: |
          set -euo pipefail
          source scripts/ci/changed_files.sh
          files=()
          collect_changed_files files HEAD^1 HEAD 'inbox/*.md'
          if ((${#files[@]})); then
            python3 scripts/validate_inbox_artifacts.py "${files[@]}"
          fi

      - name: Validate OpenSpec
        if: steps.scope.outputs.openspec == 'true'
        env:
          ARCHIVED: ${{ steps.scope.outputs.openspec_archived }}
          BULK: ${{ steps.scope.outputs.openspec_bulk }}
          CHANGE_TARGETS: ${{ steps.scope.outputs.openspec_change_targets }}
          SPEC_TARGETS: ${{ steps.scope.outputs.openspec_spec_targets }}
        run: bash scripts/ci/openspec.sh

      - name: Set up Python
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.routes == 'true' || steps.scope.outputs.json == 'true' || steps.scope.outputs.toml == 'true' || steps.scope.outputs.tach == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install structured-data tooling
        if: steps.scope.outputs.json == 'true' || steps.scope.outputs.toml == 'true'
        run: npm install --prefix .local/tooling --no-save --package-lock=false @biomejs/biome@2 tombi@1

      - name: Validate changed JSON
        if: steps.scope.outputs.json == 'true'
        run: |
          set -euo pipefail
          source scripts/ci/changed_files.sh
          files=()
          collect_changed_files files HEAD^1 HEAD '*.json' '*.jsonc'
          if ((${#files[@]})); then
            python scripts/biome.py check "${files[@]}"
          fi

      - name: Validate changed TOML
        if: steps.scope.outputs.toml == 'true'
        run: |
          set -euo pipefail
          source scripts/ci/changed_files.sh
          files=()
          collect_changed_files files HEAD^1 HEAD '*.toml'
          if ((${#files[@]})); then
            python scripts/tombi.py format --check "${files[@]}"
            python scripts/tombi.py lint "${files[@]}"
          else
            python scripts/tombi.py --version
          fi

      - name: Set up uv
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.lefthook == 'true' || steps.scope.outputs.routes == 'true' || steps.scope.outputs.tach == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify dependency lock
        if: steps.scope.outputs.python == 'true'
        run: uv lock --check

      - name: Sync dependencies
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.tach == 'true'
        run: uv sync --locked

      - name: Check Python dependency boundaries
        if: steps.scope.outputs.tach == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync tach check
          uv run --no-sync pytest -q -p no:sugar --tb=short tests/scripts/test_tach.py tests/scripts/test_tach_config.py tests/review_ai/test_dependency_boundaries.py

      - name: Verify package build
        if: steps.scope.outputs.python == 'true'
        run: uv build --wheel --out-dir /tmp/dist

      - name: Validate Python
        if: steps.scope.outputs.python == 'true'
        env:
          FULL_TYPE: ${{ steps.scope.outputs.full_type }}
          TYPE_TARGETS: ${{ steps.scope.outputs.type_targets }}
        run: bash scripts/ci/python.sh

      - name: Validate chatbot routes
        if: steps.scope.outputs.routes == 'true'
        run: uv run --no-project --with "PyYAML==6.0.3" python -m scripts.agent_routes --check

      - name: Validate Lefthook config
        if: steps.scope.outputs.lefthook == 'true'
        run: uvx lefthook@2.1.10 validate

      - name: Run selected tests
        if: steps.scope.outputs.tests == 'true'
        env:
          FULL_TESTS: ${{ steps.scope.outputs.full_tests }}
          FULL_UNIT: ${{ steps.scope.outputs.full_unit }}
          TARGETS: ${{ steps.scope.outputs.targets }}
          CI_TARGETS: ${{ steps.scope.outputs.ci_targets }}
        run: bash scripts/ci/pytest.sh

      - name: Run dependency runtime smoke
        if: steps.scope.outputs.runtime_smoke == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync pytest \
            -q \
            -p no:sugar \
            --color=no \
            --tb=short \
            -ra \
            -m "not memory and not stress" \
            tests/dbt/test_analytics_foundation.py \
            tests/orchestration/test_airflow_dag.py
