name: CI Lite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-lite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout prospective merge
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changes
        id: scope
        run: bash .github/workflows/classify_changes.sh "$GITHUB_OUTPUT"

      - name: Set up rumdl
        if: steps.scope.outputs.markdown == 'true'
        uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f # v0
        with:
          install-only: true
          version: "0.2.48"

      - name: Format changed Markdown and validate docs
        if: steps.scope.outputs.markdown == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < <(
            bash .github/workflows/classify_changes.sh --markdown-paths
          )
          if ((${#files[@]})); then
            rumdl fmt "${files[@]}"
            if ! git diff --quiet -- "${files[@]}"; then
              echo "Markdown formatting suggestions (non-blocking):"
              git diff -- "${files[@]}"
              {
                echo "### Markdown formatting suggestions"
                echo
                echo "rumdl found safe formatting changes. CI applied them only in its disposable workspace; formatting-only drift does not fail this check."
                echo
                echo '```diff'
                git diff -- "${files[@]}"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            docs=()
            for path in "${files[@]}"; do
              [[ "$path" == docs/* ]] && docs+=("$path")
            done
            if ((${#docs[@]})); then
              rumdl check "${docs[@]}"
            fi
          fi

      - name: Validate changed Inbox artifacts
        if: steps.scope.outputs.inbox == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only HEAD^1 HEAD -- inbox/ \
              | while IFS= read -r path; do
                  [[ "$path" == *.md && -f "$path" ]] && printf '%s\n' "$path"
                done
          )
          if ((${#files[@]})); then
            python3 scripts/validate_inbox_artifacts.py "${files[@]}"
          fi

      - name: Validate OpenSpec
        if: steps.scope.outputs.openspec == 'true'
        env:
          ARCHIVED: ${{ steps.scope.outputs.openspec_archived }}
          BULK: ${{ steps.scope.outputs.openspec_bulk }}
          CHANGE_TARGETS: ${{ steps.scope.outputs.openspec_change_targets }}
          SPEC_TARGETS: ${{ steps.scope.outputs.openspec_spec_targets }}
        run: |
          set -euo pipefail
          validate=(
            npm exec --yes --package @fission-ai/openspec@1.12.0 --
            openspec validate
          )

          if [[ "$BULK" == true ]]; then
            "${validate[@]}" --all --strict
          else
            read -r -a specs <<< "$SPEC_TARGETS"
            for target in "${specs[@]}"; do
              "${validate[@]}" "$target" --type spec --strict
            done

            read -r -a changes <<< "$CHANGE_TARGETS"
            for target in "${changes[@]}"; do
              "${validate[@]}" "$target" --type change --strict
            done

            if [[ "$ARCHIVED" == true ]]; then
              "${validate[@]}" --archived
            fi

            if ((${#specs[@]} == 0 && ${#changes[@]} == 0)) && [[ "$ARCHIVED" != true ]]; then
              echo "OpenSpec changed paths were not assigned a validation target" >&2
              exit 1
            fi
          fi

      - name: Set up Python
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.routes == 'true' || steps.scope.outputs.json == 'true' || steps.scope.outputs.toml == 'true' || steps.scope.outputs.tach == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install structured-data tooling
        if: steps.scope.outputs.json == 'true' || steps.scope.outputs.toml == 'true'
        run: npm install --prefix .local/tooling --no-save --package-lock=false @biomejs/biome@2 tombi@1

      - name: Validate changed JSON
        if: steps.scope.outputs.json == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only HEAD^1 HEAD -- '*.json' '*.jsonc' \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done
          )
          if ((${#files[@]})); then
            python scripts/biome.py check "${files[@]}"
          fi

      - name: Validate changed TOML
        if: steps.scope.outputs.toml == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only HEAD^1 HEAD -- '*.toml' \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done
          )
          if ((${#files[@]})); then
            python scripts/tombi.py format --check "${files[@]}"
            python scripts/tombi.py lint "${files[@]}"
          else
            python scripts/tombi.py --version
          fi

      - name: Set up uv
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.lefthook == 'true' || steps.scope.outputs.routes == 'true' || steps.scope.outputs.tach == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify dependency lock
        if: steps.scope.outputs.python == 'true'
        run: uv lock --check

      - name: Sync dependencies
        if: steps.scope.outputs.tests == 'true' || steps.scope.outputs.python == 'true' || steps.scope.outputs.tach == 'true'
        run: uv sync --locked

      - name: Check Python dependency boundaries
        if: steps.scope.outputs.tach == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync tach check
          uv run --no-sync pytest -q -p no:sugar --tb=short tests/scripts/test_tach.py tests/scripts/test_tach_config.py tests/review_ai/test_dependency_boundaries.py

      - name: Verify package build
        if: steps.scope.outputs.python == 'true'
        run: uv build --wheel --out-dir /tmp/dist

      - name: Validate Python
        if: steps.scope.outputs.python == 'true'
        env:
          FULL_TYPE: ${{ steps.scope.outputs.full_type }}
          TYPE_TARGETS: ${{ steps.scope.outputs.type_targets }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only HEAD^1 HEAD -- '*.py' \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done
          )
          if ((${#files[@]})); then
            uv run --no-sync ruff check "${files[@]}"
            uv run --no-sync ruff format --check "${files[@]}"
          fi

          if [[ "$FULL_TYPE" == true ]]; then
            uv run --no-sync ty check
            exit
          fi

          read -r -a type_targets <<< "$TYPE_TARGETS"
          type_targets+=("${files[@]}")
          if ((${#type_targets[@]})); then
            uv run --no-sync ty check "${type_targets[@]}"
          fi

      - name: Validate chatbot routes
        if: steps.scope.outputs.routes == 'true'
        run: uv run --no-project --with "PyYAML==6.0.3" python scripts/generate_agent_routes.py --check

      - name: Validate Lefthook config
        if: steps.scope.outputs.lefthook == 'true'
        run: uvx lefthook@2.1.10 validate

      - name: Run selected tests
        if: steps.scope.outputs.tests == 'true'
        env:
          FULL_TESTS: ${{ steps.scope.outputs.full_tests }}
          FULL_UNIT: ${{ steps.scope.outputs.full_unit }}
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          set -euo pipefail
          common=(
            uv run --no-sync pytest
            -q
            -p no:sugar
            --color=no
            --tb=short
            -ra
          )

          if [[ "$FULL_TESTS" == true ]]; then
            "${common[@]}" -n auto -m "not memory and not stress"
            exit
          elif [[ "$FULL_UNIT" == true ]]; then
            "${common[@]}" -n auto -m "unit and not memory and not stress"
            exit
          fi

          read -r -a targets <<< "$TARGETS"
          if ((${#targets[@]} == 0)); then
            exit
          elif ((${#targets[@]} >= 3)); then
            "${common[@]}" -n auto -m "not memory and not stress" "${targets[@]}"
          else
            "${common[@]}" -m "not memory and not stress" "${targets[@]}"
          fi

      - name: Run dependency runtime smoke
        if: steps.scope.outputs.runtime_smoke == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync pytest \
            -q \
            -p no:sugar \
            --color=no \
            --tb=short \
            -ra \
            -m "not memory and not stress" \
            tests/dbt/test_analytics_foundation.py \
            tests/orchestration/test_airflow_dag.py
